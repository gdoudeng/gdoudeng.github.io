(function(){
  try {
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
})();
</script>

<main>
<article class="post">
  <div class="crumb">2021 / 08 / 06</div>

  <h1>git忽略已经被提交的文件</h1>

  <div class="post-meta">
    <a href="/categories/#杂记">杂记</a> · <a href="/tags/git/">git</a>
  </div>

  <div class="post-body"><p>有时候你会发现，一些build目录 自动生成的文件不小心被你提交并且推送到了远程仓库，此时你去修改gitignore文件就会于事无补。</p>
<ul>
<li>正确姿势：</li>
</ul>
<p>单个文件
<code>git rm --cached logs/xx.log</code>，</p>
<p>文件夹
<code>git rm -r --cached unpackage/*</code></p>
<p>然后更新 <code>.gitignore</code> 忽略掉目标文件，</p>
<p>最后 <code>git commit -m &quot;忽略此文件&quot;</code></p>
</div>
</article>
</main>

<script>
(function(){
  var btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  function apply(theme) {
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    btn.textContent = theme === 'dark' ? '浅色' : '深色';
    btn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色模式' : '切换到深色模式');
    btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  }
  apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  btn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', next); } catch (e) {}
    apply(next);
  });
})();
</script>
<script>
(function(){
  function openTarget() {
    if (!location.hash) return;
    var el;
    try { el = document.getElementById(decodeURIComponent(location.hash.slice(1))); }
    catch (e) { return; }
    if (el && el.tagName === 'DETAILS') {
      el.open = true;
      el.scrollIntoView();
    }
  }
  openTarget();
  window.addEventListener('hashchange', openTarget);
})();
</script>
<script>
(function(){
  if (!(window.navigator && navigator.clipboard && navigator.clipboard.writeText)) return;
  var blocks = document.querySelectorAll('.post-body pre.shiki');
  var RESET_DELAY = 2000;
  for (var i = 0; i < blocks.length; i++) {
    (function (pre) {
      var wrap = document.createElement('div');
      wrap.className = 'code-block';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      pre.classList.add('has-copy-btn');

      // 语言标签取自 Shiki 写在 <code> 上的 language-xxx。
      // text 是 Shiki 对无语言标记代码块的兜底值，不显示标签。
      var codeEl = pre.querySelector('code');
      var cls = (codeEl && codeEl.className) || '';
      var m = cls.match(/language-([\w-]+)/);
      var raw = m ? m[1] : '';
      var lang = ({
        js: 'JS', typescript: 'TS', html: 'HTML', css: 'CSS', bash: 'Bash',
        'objective-c': 'Obj-C', json: 'JSON', xml: 'XML', java: 'Java',
        ini: 'INI', ruby: 'Ruby', c: 'C', groovy: 'Groovy'
      })[raw] || (raw && raw !== 'text' ? raw.toUpperCase() : '');

      var COPY_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
        + '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/>'
        + '<path d="M10.5 5.5v-2a1.5 1.5 0 0 0-1.5-1.5H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5h2"/></svg>';
      var DONE_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">'
        + '<path d="M3 8.5 6.5 12 13 4.5"/></svg>';

      // 无障碍名里必须含有按钮上那两个可见字符（语言标签），否则用语音
      // 控制的人说「点击 JS」——他们能看到的就是这两个字——不会命中这个
      // 按钮。WCAG 2.5.3 Label in Name 说的就是这件事。
      var idleLabel = lang ? '复制 ' + lang + ' 代码' : '复制代码';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'copy-btn';
      btn.innerHTML = COPY_ICON + (lang ? '<span>' + lang + '</span>' : '');
      btn.setAttribute('aria-label', idleLabel);
      btn.setAttribute('aria-live', 'polite');
      wrap.appendChild(btn);

      var resetTimer = null;
      function setState(icon, label, stateClass) {
        if (resetTimer) { clearTimeout(resetTimer); }
        btn.innerHTML = icon + (label ? '<span>' + label + '</span>' : '');
        // 反馈态的可见文字就是完整的一句话，无障碍名直接用它，两者一致。
        btn.setAttribute('aria-label', label || idleLabel);
        btn.classList.remove('is-copied', 'is-error');
        btn.classList.add(stateClass);
        resetTimer = setTimeout(function () {
          btn.innerHTML = COPY_ICON + (lang ? '<span>' + lang + '</span>' : '');
          btn.setAttribute('aria-label', idleLabel);
          btn.classList.remove(stateClass);
          resetTimer = null;
        }, RESET_DELAY);
      }

      btn.addEventListener('click', function () {
        // textContent 不含 CSS counter 生成的行号（那在 ::before 的 content 里）
        var text = (codeEl || pre).textContent;
        navigator.clipboard.writeText(text).then(function () {
          setState(DONE_ICON, '已复制', 'is-copied');
        }, function () {
          setState(COPY_ICON, '复制失败', 'is-error');
        });
      });
    })(blocks[i]);
  }
})();
</script>
